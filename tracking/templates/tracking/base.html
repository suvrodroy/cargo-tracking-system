<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CargoTrack</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa;
            color: #111827;
        }
        
        /* Typography */
        .fw-editorial { font-weight: 800; letter-spacing: -0.03em; }
        .text-muted-heavy { color: #6b7280; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .stat-huge { font-size: 4rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
        
        /* Layout & Components */
        .navbar { border-bottom: 1px solid #e5e7eb; background-color: #ffffff; }
        .nav-link { font-weight: 600; color: #374151 !important; }
        .nav-link:hover { color: #000000 !important; }
        
        .card-clean {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        .btn-dark-editorial {
            background-color: #111827;
            color: #ffffff;
            font-weight: 600;
            border-radius: 6px;
            padding: 0.6rem 1.2rem;
            border: none;
            transition: all 0.2s;
        }
        .btn-dark-editorial:hover { background-color: #000000; color: #ffffff; }
        
        /* Status Indicators & Live Activity */
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .bg-pending { background-color: #9ca3af; }
        .bg-transit { background-color: #3b82f6; }
        .bg-delivery { background-color: #f59e0b; }
        .bg-delivered { background-color: #10b981; }
        
        .pulse-transit {
            box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            animation: pulse-blue 2s infinite;
        }
        
        @keyframes pulse-blue {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(59, 130, 246, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }

        /* Timeline */
        .timeline-container { border-left: 2px solid #e5e7eb; padding-left: 1.5rem; margin-left: 0.5rem; position: relative; }
        .timeline-item { margin-bottom: 2rem; position: relative; }
        .timeline-dot {
            position: absolute;
            left: -1.85rem;
            top: 0.25rem;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background-color: #111827;
            border: 2px solid #ffffff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg py-3 mb-5">
    <div class="container">
        <a class="navbar-brand fw-editorial fs-4 text-dark" href="{% url 'public_index' %}">CargoTrack.</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <li class="nav-item me-4">
                        <span class="text-muted-heavy">Operating as {{ user.username }}</span>
                    </li>
                    <li class="nav-item me-3">
                        <a class="nav-link" href="{% url 'dashboard' %}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-link nav-link text-danger">Sign Out</button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item me-3">
                        <a class="nav-link" href="{% url 'login' %}">Sign In</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-dark-editorial" href="{% url 'register' %}">Create Account</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
